    <path d="M40,52 C22,48 13,58 18,71 C23,82 40,84 50,76 C41,69 39,60 44,53 Z" fill="url(#claw)" stroke="#15233B" stroke-width="2.5" stroke-linejoin="round"></path>
    <path d="M26,36 C42,28 58,34 58,49 C58,58 49,62 42,57 C45,51 41,45 32,46 Z" fill="#FDBA74" stroke="#15233B" stroke-width="2.5" stroke-linejoin="round"></path>
    <path d="M136,96 C150,84 160,66 162,52 L148,48 C144,64 130,84 120,92 Z" fill="url(#limb)" stroke="#15233B" stroke-width="2.5" stroke-linejoin="round"></path>
    <path d="M160,52 C178,48 187,58 182,71 C177,82 160,84 150,76 C159,69 161,60 156,53 Z" fill="url(#claw)" stroke="#15233B" stroke-width="2.5" stroke-linejoin="round"></path>
    <path d="M174,36 C158,28 142,34 142,49 C142,58 151,62 158,57 C155,51 159,45 168,46 Z" fill="#FDBA74" stroke="#15233B" stroke-width="2.5" stroke-linejoin="round"></path>
