    <clipPath id="shellClip">
      <path d="M50,122 C50,92 72,72 100,72 C128,72 150,92 150,122 C150,140 126,150 100,150 C74,150 50,140 50,122 Z"></path>
    </clipPath>
  </defs>

  <rect width="200" height="200" rx="44" fill="#FFF7ED"></rect>

  <g transform="translate(18,18) scale(0.82)">
