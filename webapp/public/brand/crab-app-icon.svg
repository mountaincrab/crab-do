    <circle cx="116" cy="61" r="9" fill="#fff" stroke="#15233B" stroke-width="2.5"></circle>
    <circle cx="85" cy="62" r="4" fill="#15233B"></circle>
    <circle cx="117" cy="62" r="4" fill="#15233B"></circle>
    <circle cx="86.5" cy="60" r="1.4" fill="#fff"></circle>
