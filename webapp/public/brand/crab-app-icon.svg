      <stop offset="1" stop-color="#F97316"></stop>
    </linearGradient>
    <linearGradient id="claw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDBA74"></stop>
      <stop offset="1" stop-color="#F97316"></stop>
