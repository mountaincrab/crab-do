name: Deploy Functions

# Builds and deploys the Cloud Functions backend. Fires when release-please
# publishes a functions-vX.Y.Z tag (or on manual dispatch). Also ships the
# Firestore rules + indexes, since those are backend config that versions
# alongside the functions.
on:
  push:
    tags: ["functions-v*"]
  workflow_dispatch: {} # allow manual redeploys from the Actions tab

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Build functions
        run: npm run build
        working-directory: functions

      - name: Write service account credentials
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy functions, Firestore rules & indexes
        run: npx --yes firebase-tools deploy --only functions,firestore:rules,firestore:indexes --project crabban --non-interactive
