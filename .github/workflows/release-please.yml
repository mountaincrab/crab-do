name: Release Please

# Single orchestrator for all three deployable surfaces. On every push to main
# it reads the Conventional Commits since the last release and, per component,
# opens/updates a "release PR" (changelog + version bump). Merging a release PR
# makes the next run create that component's GitHub Release + tag AND, in the
# same run, call the matching deploy/release job below — gated on release-please's
# per-component `*--release_created` outputs.
#
# No PAT needed: because the deploy work runs as jobs in THIS workflow (rather
# than separate workflows triggered by the tag push), the default GITHUB_TOKEN
# is enough. (Tag pushes made with GITHUB_TOKEN do not trigger other workflows.)
#
# Which component a commit bumps is decided by the PATH of the files it touched
# (release-please "manifest" mode). Config: release-please-config.json +
# .release-please-manifest.json.
on:
  push:
    branches: ["main"]

permissions:
  contents: write # create tags + releases, push the release-PR branch
  pull-requests: write # open/update the per-component release PRs

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      # Manifest-mode outputs are keyed by the package PATH from the manifest.
      android_released: ${{ steps.rp.outputs['app--release_created'] }}
      android_tag: ${{ steps.rp.outputs['app--tag_name'] }}
      webapp_released: ${{ steps.rp.outputs['webapp--release_created'] }}
      functions_released: ${{ steps.rp.outputs['functions--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Each job runs only when its surface's release PR was just merged. The bodies
  # live in reusable workflows so they can also be run on their own via
  # workflow_dispatch (manual redeploy) from the Actions tab.
  deploy-web:
    name: Deploy Web
    needs: release-please
    if: needs.release-please.outputs.webapp_released == 'true'
    uses: ./.github/workflows/deploy-web.yml
    secrets: inherit

  deploy-functions:
    name: Deploy Functions
    needs: release-please
    if: needs.release-please.outputs.functions_released == 'true'
    uses: ./.github/workflows/deploy-functions.yml
    secrets: inherit

  release-android:
    name: Release Android
    needs: release-please
    if: needs.release-please.outputs.android_released == 'true'
    uses: ./.github/workflows/release-android.yml
    with:
      tag: ${{ needs.release-please.outputs.android_tag }}
    secrets: inherit
