name: Release Android

# Builds the release APK and attaches it to the GitHub Release for an
# android-vX.Y.Z tag. Normally called by release-please.yml (which passes the
# tag it just created); can also be run on its own from the Actions tab
# (workflow_dispatch) to (re)build and attach the APK for an existing tag.
#
# release-please owns the Release notes; this only uploads the APK asset onto it.
# Checking out the tag makes Gradle derive a clean X.Y.Z versionName.
on:
  workflow_call:
    inputs:
      tag:
        description: "android-v* tag to build and attach the APK to"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing android-v* tag to build and attach the APK to"
        required: true
        type: string

permissions:
  contents: write # upload the APK asset to the release

jobs:
  build-release:
    name: Build & Attach APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }} # the tagged commit, so Gradle resolves a clean version
          fetch-depth: 0 # full history + tags for the version derivation

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Decode google-services.json
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
            echo "Using real google-services.json from secret"
          else
            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "stub-project",
              "storage_bucket": "stub-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.mountaincrab.crabdo"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "stub"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
            echo "GOOGLE_SERVICES_JSON secret not set; using stub (Firebase will not work at runtime)"
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Decode debug keystore
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            echo "$DEBUG_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/debug.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
            echo "Keystore decoded from secret"
          else
            echo "DEBUG_KEYSTORE secret not set; using ephemeral key (Google Sign-In won't work in this build)"
          fi
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Rename APK
        id: apk_name
        run: |
          VERSION=$(./gradlew -q :app:printVersionName)
          echo "name=crabdo-${VERSION}" >> "$GITHUB_OUTPUT"
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/crabdo-${VERSION}.apk"

      - name: Attach APK to the release
        # No name/body here on purpose: release-please owns the release notes.
        # softprops upserts onto the existing release for this tag and just
        # adds the APK asset.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: app/build/outputs/apk/debug/${{ steps.apk_name.outputs.name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
