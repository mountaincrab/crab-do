name: Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write # push tags + create releases

jobs:
  release:
    name: Tag, Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for conventional-commit analysis

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: "v"
          # Conventional-commit mapping (action defaults):
          #   feat: -> minor, fix: -> patch, BREAKING CHANGE / ! -> major

      # All steps below run only when a new tag was actually created. The build
      # happens AFTER tagging so Gradle's `git describe` sees the new tag and
      # emits a clean X.Y.Z versionName (no lag, no second workflow needed).

      - name: Sync the new tag locally
        if: steps.tag.outputs.new_tag != ''
        run: git fetch origin --tags --force

      - name: Set up JDK 17
        if: steps.tag.outputs.new_tag != ''
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Gradle packages
        if: steps.tag.outputs.new_tag != ''
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Decode google-services.json
        if: steps.tag.outputs.new_tag != ''
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
            echo "Using real google-services.json from secret"
          else
            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "stub-project",
              "storage_bucket": "stub-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.mountaincrab.crabdo"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "stub"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
            echo "GOOGLE_SERVICES_JSON secret not set; using stub (Firebase will not work at runtime)"
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Decode debug keystore
        if: steps.tag.outputs.new_tag != ''
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            echo "$DEBUG_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/debug.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
            echo "Keystore decoded from secret"
          else
            echo "DEBUG_KEYSTORE secret not set; using ephemeral key (Google Sign-In won't work in this build)"
          fi
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}

      - name: Build debug APK
        if: steps.tag.outputs.new_tag != ''
        run: ./gradlew :app:assembleDebug

      - name: Rename APK
        if: steps.tag.outputs.new_tag != ''
        run: mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/crabdo-${{ steps.tag.outputs.new_tag }}.apk"

      - name: Create GitHub Release
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          files: app/build/outputs/apk/debug/crabdo-${{ steps.tag.outputs.new_tag }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
