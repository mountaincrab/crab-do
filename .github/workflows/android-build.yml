name: Android Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Build (Android)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Compute APK name
        id: apk_name
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          BRANCH="${GITHUB_REF_NAME//\//-}"
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            NAME="crabdo-v${VERSION}"
          else
            NAME="crabdo-${BRANCH}-${SHORT_SHA}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Decode google-services.json
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
            echo "Using real google-services.json from secret"
          else
            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "stub-project",
              "storage_bucket": "stub-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.mountaincrab.crabdo"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "stub"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
            echo "GOOGLE_SERVICES_JSON secret not set; using stub (Firebase will not work at runtime)"
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Decode debug keystore
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            echo "$DEBUG_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/debug.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
            echo "Keystore decoded from secret"
          else
            echo "DEBUG_KEYSTORE secret not set; using ephemeral key (Google Sign-In won't work in this build)"
          fi
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/${{ steps.apk_name.outputs.name }}.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk_name.outputs.name }}
          path: app/build/outputs/apk/debug/${{ steps.apk_name.outputs.name }}.apk
          retention-days: 14
